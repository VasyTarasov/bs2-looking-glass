name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit and test package
        shell: pwsh
        run: |
          python tools/repo_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package.py --output "$env:RUNNER_TEMP/BLACK-SOULS-II-QoL-Pack.zip"
          exit $LASTEXITCODE
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ('Parse failure: '+$_.Name) }
          }
      - name: Build and test offline Windows distribution
        shell: pwsh
        run: |
          python tools/build_distribution.py --download --python-archive "$env:RUNNER_TEMP/python-embed.zip" --output "$env:RUNNER_TEMP/QoL-Pack.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/QoL-Pack.zip" -DestinationPath "$env:RUNNER_TEMP/Offline QA"
          $version=(Get-Content -LiteralPath project.json -Raw | ConvertFrom-Json).version
          $root=Join-Path "$env:RUNNER_TEMP/Offline QA" ('BLACK-SOULS-II-QoL-Pack-'+$version)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Test-distribution.ps1 -Root $root
          exit $LASTEXITCODE
