name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: Do not attach saves, credentials, diagnostic dumps or your whole game folder. English or Russian is welcome.
  - type: input
    id: version
    attributes:
      label: Mod version and game build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction and enabled modules
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
